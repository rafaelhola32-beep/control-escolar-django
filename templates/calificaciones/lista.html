{% extends 'base.html' %}

{% block content %}

<h1 class="mb-4">
    Calificaciones
</h1>

<a href="/calificaciones/crear/"
   class="btn btn-primary mb-3">

    Nueva Calificación

</a>

<table class="table table-striped table-bordered">

    <thead class="table-dark">

        <tr>

            <th>Estudiante</th>
            <th>Grupo</th>
            <th>Calificación</th>
            <th>Acciones</th>

        </tr>

    </thead>

    <tbody>

        {% for calificacion in calificaciones %}

        <tr>

            <td>{{ calificacion.estudiante }}</td>
            <td>{{ calificacion.grupo }}</td>
            <td>{{ calificacion.calificacion }}</td>

            <td>

                <a href="/calificaciones/editar/{{ calificacion.id }}/"
                   class="btn btn-warning btn-sm">

                    Editar

                </a>

                <a href="/calificaciones/eliminar/{{ calificacion.id }}/"
                   class="btn btn-danger btn-sm">

                    Eliminar

                </a>

            </td>

        </tr>

        {% endfor %}

    </tbody>

</table>

{% endblock %}
